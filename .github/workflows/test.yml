name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check store.js
          node --check client.js
      - name: Unit tests
        run: node --test test/store.test.mjs test/host.test.mjs
      - name: Browser smoke test
        run: node --test test/client.smoke.mjs
